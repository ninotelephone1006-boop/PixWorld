<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#58a6e8" />
    <title>PixWorld — Prototype 2D</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #58a6e8;
      }

      .game {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 320px;
        overflow: hidden;
        isolation: isolate;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        top: clamp(18px, 4vw, 34px);
        left: clamp(18px, 4vw, 36px);
        display: grid;
        gap: 12px;
        color: #fff;
        pointer-events: none;
        user-select: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 28%);
        border-radius: 12px;
        background: rgb(16 52 91 / 30%);
        box-shadow: 0 7px 20px rgb(18 53 88 / 12%);
      }

      .brand-mark::before {
        width: 11px;
        height: 20px;
        border-radius: 3px;
        background: #ffbf67;
        box-shadow: 0 0 0 2px rgb(15 49 84 / 45%);
        content: "";
      }

      .brand-name {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      .brand-caption {
        margin: 3px 0 0;
        color: rgb(255 255 255 / 72%);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 11px;
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 12px;
        background: rgb(16 52 91 / 26%);
        backdrop-filter: blur(8px);
      }

      .control {
        display: flex;
        align-items: center;
        gap: 6px;
        color: rgb(255 255 255 / 85%);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .control + .control {
        margin-left: 4px;
      }

      kbd {
        display: inline-grid;
        min-width: 25px;
        height: 25px;
        padding: 0 6px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 24%);
        border-bottom-width: 2px;
        border-radius: 7px;
        background: rgb(255 255 255 / 12%);
        color: #fff;
        font: inherit;
        font-size: 11px;
        font-weight: 800;
      }

      .control kbd.space {
        min-width: 51px;
        font-size: 10px;
      }

      .hint {
        position: absolute;
        right: clamp(18px, 4vw, 36px);
        bottom: clamp(18px, 4vw, 30px);
        margin: 0;
        color: rgb(255 255 255 / 74%);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        pointer-events: none;
        user-select: none;
      }

      @media (max-width: 560px) {
        .controls {
          flex-wrap: wrap;
          max-width: min(330px, calc(100vw - 36px));
          gap: 7px 11px;
        }

        .control + .control {
          margin-left: 0;
        }

        .hint {
          font-size: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="game" aria-label="Jeu de plateforme PixWorld">
      <canvas id="world" aria-label="Un ninja animé sur un sol gris, dans un ciel bleu."></canvas>

      <section class="hud" aria-label="Commandes du jeu">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1 class="brand-name">PIXWORLD</h1>
            <p class="brand-caption">Prototype 2D</p>
          </div>
        </div>
        <div class="controls">
          <span class="control"><kbd>A</kbd> gauche</span>
          <span class="control"><kbd>D</kbd> droite</span>
          <span class="control"><kbd class="space">ESPACE</kbd> sauter</span>
          <span class="control"><kbd>X</kbd> attaquer</span>
        </div>
      </section>

      <p class="hint">ESPACE SAUTE · X ATTAQUE</p>
    </main>

    <script>
      (() => {
        const canvas = document.querySelector("#world");
        const ctx = canvas.getContext("2d");
        const keys = new Set();
        const spriteSheet = new Image();
        spriteSheet.src = "assets/ninja-black-32x32.png";

        const groundHeight = 84;
        const frameSize = 32;
        const spriteScale = 4;
        const spriteDrawSize = frameSize * spriteScale;
        const spriteTopPadding = 9 * spriteScale;
        const attackDuration = 0.36;
        const player = {
          x: 112,
          y: 0,
          width: 42,
          height: 60,
          velocityX: 0,
          velocityY: 0,
          speed: 340,
          jumpStrength: 700,
          grounded: true,
          facing: 1,
          animationTime: 0,
          attackTime: 0,
          landingTime: 0,
        };

        let width = 0;
        let height = 0;
        let groundY = 0;
        let lastTime = 0;

        function resize() {
          const ratio = Math.min(window.devicePixelRatio || 1, 2);
          const bounds = canvas.getBoundingClientRect();
          width = bounds.width;
          height = bounds.height;
          canvas.width = Math.round(width * ratio);
          canvas.height = Math.round(height * ratio);
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
          ctx.imageSmoothingEnabled = false;
          groundY = Math.max(0, height - groundHeight);
          player.x = Math.min(player.x, Math.max(0, width - player.width));
          if (player.grounded) player.y = groundY - player.height;
          draw();
        }

        function isLeftPressed() {
          return (
            keys.has("KeyQ") ||
            keys.has("KeyA") ||
            keys.has("q") ||
            keys.has("a") ||
            keys.has("ArrowLeft")
          );
        }

        function isRightPressed() {
          return keys.has("KeyD") || keys.has("d") || keys.has("ArrowRight");
        }

        function update(delta) {
          player.animationTime += delta;
          player.attackTime = Math.max(0, player.attackTime - delta);
          player.landingTime = Math.max(0, player.landingTime - delta);

          const direction = Number(isRightPressed()) - Number(isLeftPressed());
          player.velocityX = direction * player.speed;
          if (direction !== 0) player.facing = direction;
          player.x += player.velocityX * delta;
          player.x = Math.max(0, Math.min(width - player.width, player.x));

          if (!player.grounded) {
            player.velocityY += 1900 * delta;
            player.y += player.velocityY * delta;

            if (player.y + player.height >= groundY) {
              player.y = groundY - player.height;
              player.velocityY = 0;
              player.grounded = true;
              player.landingTime = 0.12;
            }
          }
        }

        function getSpriteFrame() {
          if (player.attackTime > 0) {
            const elapsed = attackDuration - player.attackTime;
            const frame = Math.min(3, Math.floor(elapsed / (attackDuration / 4)));
            return { column: 3, row: frame };
          }

          if (!player.grounded) {
            return { column: 2, row: player.velocityY < 0 ? 0 : 1 };
          }

          if (player.landingTime > 0) {
            return { column: 2, row: 2 };
          }

          if (Math.abs(player.velocityX) > 0.5) {
            return { column: 1, row: Math.floor(player.animationTime * 10) % 4 };
          }

          return { column: 0, row: Math.floor(player.animationTime * 5) % 4 };
        }

        function drawPlayer() {
          if (!spriteSheet.complete || spriteSheet.naturalWidth === 0) return;

          const { column, row } = getSpriteFrame();
          const sourceX = column * frameSize;
          const sourceY = row * frameSize;
          const centerX = player.x + player.width / 2;
          const drawY = player.y - spriteTopPadding;

          ctx.save();
          ctx.translate(centerX, 0);
          ctx.scale(player.facing, 1);
          ctx.drawImage(
            spriteSheet,
            sourceX,
            sourceY,
            frameSize,
            frameSize,
            -spriteDrawSize / 2,
            drawY,
            spriteDrawSize,
            spriteDrawSize,
          );
          ctx.restore();
        }

        function draw() {
          ctx.clearRect(0, 0, width, height);

          // Ciel bleu uni.
          ctx.fillStyle = "#58a6e8";
          ctx.fillRect(0, 0, width, height);

          // Sol gris.
          ctx.fillStyle = "#858c94";
          ctx.fillRect(0, groundY, width, height - groundY);
          ctx.fillStyle = "#707982";
          ctx.fillRect(0, groundY, width, 5);

          // Ombre discrète pour ancrer le sprite au sol pendant le saut.
          ctx.fillStyle = "rgba(23, 59, 91, 0.18)";
          ctx.beginPath();
          ctx.ellipse(
            player.x + player.width / 2,
            groundY + 7,
            player.width * (player.grounded ? 0.58 : 0.42),
            5,
            0,
            0,
            Math.PI * 2,
          );
          ctx.fill();

          drawPlayer();
        }

        function frame(time) {
          const delta = lastTime ? Math.min((time - lastTime) / 1000, 0.04) : 0;
          lastTime = time;
          update(delta);
          draw();
          requestAnimationFrame(frame);
        }

        window.addEventListener("keydown", (event) => {
          const keyLabel = event.key.toLowerCase();
          const controlCode = [
            "KeyQ",
            "KeyA",
            "KeyD",
            "ArrowLeft",
            "ArrowRight",
            "Space",
            "KeyX",
          ].includes(event.code);
          const controlLabel = ["a", "q", "d", "x"].includes(keyLabel);
          if (controlCode || controlLabel) event.preventDefault();

          keys.add(event.code);
          if (keyLabel.length === 1) keys.add(keyLabel);

          if (event.code === "Space" && !event.repeat && player.grounded) {
            player.velocityY = -player.jumpStrength;
            player.grounded = false;
          }

          if (
            (event.code === "KeyX" || keyLabel === "x") &&
            !event.repeat &&
            player.attackTime === 0
          ) {
            player.attackTime = attackDuration;
          }
        });

        window.addEventListener("keyup", (event) => {
          keys.delete(event.code);
          keys.delete(event.key.toLowerCase());
        });
        window.addEventListener("blur", () => keys.clear());
        window.addEventListener("resize", resize);

        resize();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
